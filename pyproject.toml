[project]
name = "bitget-stock-trader"
version = "0.1.0"
description = "AI 美股合约交易分析工具"
requires-python = ">=3.11"
dependencies = [
    # 核心
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "python-dateutil>=2.8,<3",

    # Web (Phase 4)
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=12,<14",

    # 数据分析
    "pandas>=2,<3",
]

[project.optional-dependencies]
dev = [
    # 测试
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<6",
    "respx>=0.22,<1",           # HTTP mock

    # 开发
    "ipython>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: 需要网络或较慢的测试",
    "integration: 端到端测试",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError",
    "raise NotImplementedForPhase",
    "if __name__ == .__main__.:",
    "def __init__",
]
