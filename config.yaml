# Bitget Stock Trader — Configuration
# 运行模式
mode: paper

# 交易品种 (Bitget stock perpetual symbols, 不加 USDT 后缀)
symbols:
  - AAPL
  - NVDA
  - TSLA
  - MSFT
  - AMZN
  - GOOGL
  - META
  - QQQ
  - SPY

# 数据源
datasources:
  bitget:
    base_url: "https://api.bitget.com"
    rate_limit: 20  # 请求/秒

  eastmoney:
    mode: auto  # auto | direct | proxy

# 新闻源
news_sources:
  primary: searxng
  fallback: null  # 未来: tavily
  searxng:
    base_url: "http://localhost:8080"
    max_results: 15
    timeout: 10

# 缓存
cache:
  memory_ttl: 300     # 内存缓存 TTL (秒)
  kline_ttl: 86400    # K线持久化 TTL (秒)

# 策略 (Phase 2 启用)
strategies:
  - id: trend_break
    enabled: true
    weight: 1.0
    params:
      fast_ma: 10
      slow_ma: 30
      volume_ratio_threshold: 1.5
  - id: rsi_bounce
    enabled: true
    weight: 0.8
    params:
      rsi_period: 14
      oversold: 30
  - id: ai_composite
    enabled: true
    weight: 1.2
    params:
      model: deepseek-v4-pro

# 风控 (Phase 3 启用)
safety:
  max_single_risk_pct: 2.0
  max_total_exposure_pct: 50
  max_leverage: 1
  max_positions: 5
  max_consecutive_losses: 5
  max_daily_drawdown_pct: 5.0

# 滑点模型 (Phase 3 启用)
slippage:
  base_spreads:
    regular: 0.0002
    extended: 0.0010
    asia: 0.0025

# 冷启动 (Phase 3 启用)
cold_start:
  evaluation_trades: 30

# 优化 (Phase 4 启用)
optimization:
  auto_tune: false
  trades_per_analysis: 50

# API 服务
api:
  host: "0.0.0.0"
  port: 8000
